# =========================================================
# Scenario Revenue Analyzer ── dayvigo（CUREAオンライン睡眠外来）
# 確定値。Codexはハードコードせず本ファイルを読むこと。
# 出典: KPI表_20260609.xlsx / 料金比較_単品料金一覧.md
# =========================================================
project: dayvigo
display_name: CUREA オンライン睡眠外来

drive:
  folder_id: "1lOKZSbIb13YJKXJ-PZbEAOxS-LeAkell"
  folder_url: "https://drive.google.com/drive/folders/1lOKZSbIb13YJKXJ-PZbEAOxS-LeAkell"
  weekly_subfolder: "weekly"
  required_files:
    ads: "ads.csv"
    lstep: "lstep.csv"
    management: ["management.csv", "management.xlsx"]

flow:
  new_flow_start: "2026-04-29"   # 新フロー集計起点

# --- KPI Excelとの比較期間（分母定義はconfig差し替え可能）---
kpi_periods:
  - key: "2026-03"
    label: "3月（旧フロー）"
    flow: old
    start: "2026-03-01"
    end: "2026-03-31"
  - key: "2026-04-old"
    label: "4月 4/7〜4/28（旧フロー）"
    flow: old
    start: "2026-04-07"
    end: "2026-04-28"
  - key: "new-flow"
    label: "新フロー（4/29〜）"
    flow: new
    start: "2026-04-29"

ingest:
  encoding: auto                  # shift_jis / utf-8 自動判定
  source: lstep_friends           # Lステップ「友だち情報（状況）」CSV

# --- 個人情報ホワイトリスト ---------------------------------
# 下記 column_mapping / tags / purchase_tags に列挙した列のみ取り込む。
drop_pii:
  - "表示名"                       # 氏名は破棄（PII非保持）

# --- 標準フィールド ⇔ CSV実列名 ----------------------------
column_mapping:
  user_id: "ID"                   # 集計キーのみ・非表示
  mark: "対応マーク"
  added_at: "友だち追加日時"
  last_action_at: "最終アクション日"
  applied_via_step: "申込経由STEP"

# --- CTA / STEP タグ（セル値が1/非空でtrue・追記式）---------
tags:
  step0a: "診察誘導_STEP0A"
  step0b: "診察誘導_STEP0B"
  step1: "診察誘導_STEP1"
  step2: "診察誘導_STEP2"
  step3: "診察誘導_STEP3"
  step4: "診察誘導_STEP4"
  step5: "診察誘導_STEP5"
  step6: "診察誘導_STEP6"
  payment_click_tanpin: "RM_決済クリック（単品）"
  payment_click_teiki: "RM_決済クリック（定期）"

# --- 購入タグ ⇔ 売上計上 ------------------------------------
purchase_tags:
  teiki: "デエビゴ定期"
  tanpin_1m: "デエビゴ1ヶ月"
  tanpin_3m: "デエビゴ3ヶ月"
  tanpin_6m: "デエビゴ6ヶ月"

# --- 単価（税込・確定）。LTVは扱わない -----------------------
pricing:
  teiki: 2980          # 3ヶ月定期 初回（診察・送料・システム無料）。2回目以降9680は計上しない
  tanpin_1m: 9680      # 薬代7480 + システム1650 + 郵送550
  tanpin_3m: 22396     # 一括計上（薬代6732×3 + 1650 + 550）
  tanpin_6m: 40348     # 一括計上（薬代6358×6 + 1650 + 550）

# --- ステータス導出（2026-06-14 新タグ運用反映）-------------
status_tags:
  paid:
    - "決済完了"                  # 既存タグ
    - "睡眠_決済済み"            # 2026-06-14追加
  monshin_submitted: "睡眠_問診票提出済み"
  shipped: "睡眠_発送済み"
status_availability:
  paid: derived
  monshin_submitted: derived
  shinsatsu_done: unavailable
  shipped: derived
  needs_follow: derived
status_available_from:
  monshin_submitted: "2026-06-14"
status_notes:
  paid: "決済完了・睡眠_決済済み・購入タグ・対応マークから導出"
  monshin_submitted: "睡眠_問診票提出済みタグから導出（2026-06-14運用開始）"
  shinsatsu_done: "専用タグをCSVへ出力できないため未計測"
  shipped: "睡眠_発送済みタグ・対応マークから導出"
  needs_follow: "決済済みかつ問診票未提出、または既存の未提出マークから導出"
status_rules:
  paid_marks:                    # 決済完了とみなすマーク
    - "発送済"
    - "今日発送済み"
    - "定期便契約中(縛り)発送済み"
    - "定期便契約中(縛りなし)"
    - "定期便契約中(縛り)"
    - "デエビゴ定期 昨日決済(新問診票未提出)"
    - "デエビゴ定期(縛り)昨日決済"
    - "1ヵ月　昨日決済(新問診票未提出)"
    - "3ヵ月　昨日決済(新問診票未提出)"
    - "6ヵ月　昨日決済(新問診票未提出)"
    - "1ヵ月　昨日決済＆問診提出済み"
    - "6ヵ月　昨日決済＆問診提出済み"
  shipped_marks:
    - "発送済"
    - "今日発送済み"
    - "定期便契約中(縛り)発送済み"
  needs_follow_marks:            # 決済済み×問診未提出（要フォロー層）
    - "デエビゴ定期 昨日決済(新問診票未提出)"
    - "1ヵ月　昨日決済(新問診票未提出)"
    - "3ヵ月　昨日決済(新問診票未提出)"
    - "6ヵ月　昨日決済(新問診票未提出)"
  needs_follow_mode: paid_without_monshin_or_marks

# --- 評価対象シナリオ（変種識別列が無ければSTEP貢献にフォールバック）
scenarios:
  - "新フロー対応 友だち追加シナリオ（2026/05/11）_登録直後・15分後"
  - "新フロー対応 友だち追加シナリオ（2026/05/11）_時刻21時指定"

# --- 広告（Google広告のみ）----------------------------------
ads:
  source: google_ads
  protected_words: ["デエビゴ", "指名"]   # 除外前に要確認

# --- スコア重み（案件特性で変更可）--------------------------
scoring:
  scenario: { cvr: 35, ctr: 20, revenue: 25, cv_speed: 10, block: 0 }  # block未計測=0

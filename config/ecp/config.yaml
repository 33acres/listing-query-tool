# =========================================================
# Scenario Revenue Analyzer ── ECP（緊急避妊薬）
# 確定値。Codexはハードコードせず本ファイルを読むこと。
# 出典: ECP/tag.md, ECP/docs/タグ命名規則_友だち追加シナリオv1.md,
#       ECP/ブラッシュアップ版シナリオ_v1.md
#
# 2026-07-30: 実データ（2026-07-28スナップショット）で全項目を検証済み。
# 「要確認」だった推測値は実ファイルの列名・ファイル構成に置き換えた。
# 検証の根拠は output/ecp/2026-07-28/bottleneck_report.md を参照。
# =========================================================
project: ecp
display_name: あしたのクリニック オンラインECP（緊急避妊薬）外来

drive:
  # 実運用フォルダ（2026-07-30 実ファイル存在を確認済み）
  folder_id: "13cvQih6BLVDjfsu0OLkHIIkQy7zGuayD"
  folder_url: "https://drive.google.com/drive/folders/13cvQih6BLVDjfsu0OLkHIIkQy7zGuayD"
  weekly_subfolder: "weekly"
  required_files:
    ads: "ads.csv"
    # ⚠️実態はlstepが友だち追加年で分割エクスポートされている
    # （lstep2022〜2025.csv + lstep{YYYYMMDD}.csv）。日次パイプラインは
    # daily_kpi.lstep.file_patterns のグロブで全ファイルを結合して読む。
    # 週次パイプライン（scripts/weekly_dashboard）は単一ファイル前提のため、
    # 週次を回す場合は最新年ファイルを lstep.csv にリネームして置くこと。
    lstep: "lstep.csv"
    management: ["management.csv", "management.xlsx"]
  output_subfolder: "output"
  output_files:
    kpi: "weekly_kpi.csv"
    bottlenecks: "bottlenecks.csv"
    audit: "analysis_meta.json"
    history: "funnel_history.csv"

weekly_dashboard:
  timezone: "Asia/Tokyo"
  run_weekday: "Tuesday"
  input_root: "output/{project}/{run_date}/raw"
  output_root: "output/{project}/{run_date}"
  history_root: "output/{project}/funnel_history.csv"
  lstep:
    # 実データ確認済み: 1行目がタグID・2行目がタグ名の2段ヘッダー。
    header_row: 2
    encodings: ["cp932", "utf-8-sig", "utf-8"]
  ads:
    # 実データ確認済み: ECPのads.csvはUTF-8。utf-16を先頭に置くと文字化けするため
    # STD/dayvigoと順序を変えてある。
    encodings: ["utf-8-sig", "utf-8", "cp932", "utf-16", "utf-16le"]
    separators: ["\t", ","]
    header_search_rows: 5
    column_aliases:
      date: ["日", "日付", "年月日", "Date", "Day"]
      clicks: ["クリック数", "クリック", "Clicks", "検索_クリック数"]
      impressions: ["表示回数", "Impr.", "Impressions", "検索_表示回数"]
      cost: ["費用", "Cost", "検索_費用"]
      conversions: ["コンバージョン", "Conversions", "検索_コンバージョン"]
      search_term: ["検索語句", "検索キーワード", "Search term"]
    account_total_labels: ["合計: アカウント"]
  management:
    # 実データ確認済み: ヘッダーは4行目（上3行は進捗・目標行）。
    # 「クリニック粗利（未入金含む）」等は列名内に改行を含む。
    header_search_rows: 5
    file_patterns:
      - "management*.csv"
      - "management*.xlsx"
      - "management*.pdf"
      - "アフターピル全体管理*.csv"
      - "アフターピル全体管理*.xlsx"
      - "アフターピル全体管理*.pdf"
      - "ECP全体管理*.csv"
      - "ECP全体管理*.xlsx"
      - "ECP全体管理*.pdf"
    column_aliases:
      date: ["日付", "date", "Date"]
      gross_profit: ["垂直粗利", "gross_profit"]
      sales: ["売上", "sales"]
      ad_cost: ["Cost", "広告費", "ad_cost"]
      impressions: ["IMP", "表示回数", "impressions"]
      clicks: ["CTs", "クリック", "クリック数", "clicks"]
      cv_f: ["CV(F)", "CV（F）", "cv_f"]
      monshin_answers: ["問診回答", "問診回答数", "monshin_answers"]
      # 実データ確認済み: ECPの購入確定列は「実CV」1本。STDのような商品別CV列
      # （72時間1回分CV等）は管理表に存在しない（商品構成はLステップの
      # 事前決済クリックタグ側でしか分からない）。
      purchase_cv: ["実CV", "購入CV", "商品CV合計", "purchase_cv"]
      aov: ["客単", "aov"]
      doctor: ["担当医", "doctor"]
    purchase_cv_component_aliases: []
  funnel_stages:
    # ⚠️ECPは管理表の「問診回答」が全日0（問診票を経由しないフロー）のため、
    # STDの5段ファネルは成立しない。実測できる4段はこれ。
    # payment_clicks はLステップの事前決済クリック4タグのユニーク数。
    - "ad_clicks"
    - "cv_f"
    - "payment_clicks"
    - "purchase_cv"

# --- 日次KPI表（scripts/daily_kpi）----------------------------
# 管理表の日次行 × Lステップのコホート集計を日付で突合し、区間別CVRの
# 悪化を自動判定する。週次（weekly_dashboard）とは独立して動く。
daily_kpi:
  timezone: "Asia/Tokyo"
  input_root: "output/{project}/{run_date}/raw"
  output_root: "output/{project}/{run_date}"
  history_root: "output/{project}/daily_kpi_history.csv"
  output_files:
    kpi: "daily_kpi.csv"
    bottleneck: "daily_bottleneck.csv"
    report: "daily_bottleneck_report.md"
    audit: "daily_kpi_meta.json"
  lstep:
    # 年別分割エクスポートを全部拾って結合する（IDで重複排除）。
    file_patterns: ["lstep*.csv"]
  management:
    header_row: 4
    # 管理表PDFの読み取りは「STDの列順」に合わせた位置決め実装しか検証できていない。
    # ECPは列構成が違う（商品別CV列が無く実CVが1本）ため、PDFを渡されたら黙って
    # ずれた数値を出すのではなく失敗させる。運用はCSVエクスポートで回す。
    pdf_layout: null
  # コホート成熟度: 友だち追加からこの日数が経つまでは決済クリック率などが
  # まだ伸びるため、ボトルネック判定の対象から外す（直近日の見かけ上の急落を
  # ボトルネックと誤認しないため）。
  cohort_maturity_days: 3
  detection:
    rolling_days: 7      # 判定に使う移動平均の窓（日次単体はノイズが大きい）
    baseline_days: 28    # 比較対象ベースライン（移動平均窓の直前n日）
    threshold_pt: 2.0    # 悪化と見なすCVR低下幅（pt）
    # ⚠️重要: ECPのSTEP/事前決済クリックタグは途中（2026年6月末）から全登録者に
    # 発火するようになった。それ以前を比較対象に入れると「タグが無かっただけ」を
    # 改善/悪化と誤判定する（実際にベースラインが198%になる事象を確認）。
    # 各タグについて「直近まで継続して min_tag_coverage 以上の付与率がある期間」を
    # 自動検出し、それより前の日は判定窓から除外する。
    min_tag_coverage: 0.15   # 登録数に対するタグ付与率の下限
    max_plausible_rate: 1.2  # 窓のCVRがこれを超えたら比較不能として無効化する
  guardrails:
    # 実績根拠: 日次Cost帯別で60万円超の日は垂直粗利が平均マイナス
    # （output/ecp/2026-07-28/bottleneck_report.md の日次Cost帯別分析）。
    daily_cost_warn: 450000
    daily_cost_alert: 600000
    min_gross_margin: 0.20    # 粗利率がこれを下回った日はアラート
    reconcile_tolerance: 0.05 # 管理表CV(F)とLステップ友だち追加数の許容乖離


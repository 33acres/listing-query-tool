  step1: "ECP_診察誘導_STEP1"
  step2: "ECP_診察誘導_STEP2"
  step3: "ECP_診察誘導_STEP3"
  step4: "ECP_診察誘導_STEP4"
  step5: "ECP_診察誘導_STEP5"
  step6: "ECP_診察誘導_STEP6"
  shina_read: "ECP_シナ読了_対象"

# --- ステータス計測 -------------------------------------------
# ⚠️実データ確認済み（2026-07-30）: 列として存在するのは ECP_決済済み のみ。
# しかもそれが全217,154人で0件＝一度も発火していない（決済システム→Lステップの
# Webhook連携が未実装）。問診票提出済み・診察完了・発送済みは列自体が存在しない。
# → 日次KPIの「購入」は管理表の実CVを正とし、Lステップ側は決済クリックまでで打ち止め。
status_tags:
  paid: "ECP_決済済み"
status_tags_missing:
  monshin_submitted: "ECP_問診票提出済み"  # 列なし
  shinsatsu_done: "ECP_診察完了"            # 列なし
  shipped: "ECP_発送済み"                   # 列なし
status_notes:
  paid: "列は存在するが全件0件。購入の個人単位紐付けは不可（集計値の突合のみ）"

# --- クリックタグ（CVR分析用・購入確定ではない）--------------

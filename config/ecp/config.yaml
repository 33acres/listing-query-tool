# --- 分岐結果タグ（診断チャットボットの最終判定）--------------
# STDのbranch_tags(treat/test)は2択だが、ECPは4択（処方可2種+処方不可2種）。
# funnel.ts的な「started」概念はこの新パイプラインには存在しないため
# （5段ファネルはlstep tagではなく管理表由来のcv_f/monshin_answers/purchase_cvで
# 計算される）、4択のままで問題なくconfig側の変更のみで完結する。
# ⚠️実データ確認済み（2026-07-30）: エクスポートに存在するのは処方不可2つのみ。
# 処方可の2タグは列自体が無く、「処方可なのに買わなかった」母数は取れない。
branch_tags:
  ng_minor: "ECP_処方不可_未成年"
  ng_time_over: "ECP_処方不可_有効時間外"
branch_tags_missing:
  ok_72_120: "ECP_処方可_72h120h"     # 列なし（Lステップ側でタグ未作成）
  ok_120_only: "ECP_処方可_120hのみ"  # 列なし（同上）


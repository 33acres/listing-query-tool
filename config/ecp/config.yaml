# として使う。商品別の内訳（72h/120h × 1回分/2回分）もここから取る。
click_tags:
  a72_1: "ECP_事前決済クリック_72時間1回分"
  a72_2: "ECP_事前決済クリック_72時間2回分"
  a120_1: "ECP_事前決済クリック_120時間1回分"
  a120_2: "ECP_事前決済クリック_120時間2回分"

